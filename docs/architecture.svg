<svg width="1000" height="490" viewBox="0 0 1000 490" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5C6470" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="490" fill="#FAFAF9"/>

  <!-- Row 1: Dashboard -->
  <g>
    <rect x="30" y="50" width="220" height="112" rx="10" fill="#EFF6F6" stroke="#4FA8A0" stroke-width="1.5"/>
    <text x="140" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1B1E27">React Dashboard</text>
    <text x="140" y="100" text-anchor="middle" font-size="12" fill="#4B5563">Activity, Clients,</text>
    <text x="140" y="118" text-anchor="middle" font-size="12" fill="#4B5563">Review, Settings</text>
    <text x="140" y="142" text-anchor="middle" font-size="11" fill="#7A8087">(Vite + Tailwind)</text>
  </g>

  <!-- Row 1: Agent API -->
  <g>
    <rect x="280" y="50" width="220" height="112" rx="10" fill="#FDF6EC" stroke="#E0A458" stroke-width="1.5"/>
    <text x="390" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1B1E27">Agent API</text>
    <text x="390" y="100" text-anchor="middle" font-size="12" fill="#4B5563">Same handler runs as</text>
    <text x="390" y="118" text-anchor="middle" font-size="12" fill="#4B5563">Flask or AWS Lambda</text>
    <text x="390" y="142" text-anchor="middle" font-size="11" fill="#7A8087">(local dev / serverless)</text>
  </g>

  <!-- Row 1: Strands Agent -->
  <g>
    <rect x="530" y="50" width="220" height="112" rx="10" fill="#EEF0FB" stroke="#7C79C9" stroke-width="1.5"/>
    <text x="640" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1B1E27">Strands Agent</text>
    <text x="640" y="100" text-anchor="middle" font-size="12" fill="#4B5563">Reasoning, tools,</text>
    <text x="640" y="118" text-anchor="middle" font-size="12" fill="#4B5563">confidence routing</text>
    <text x="640" y="142" text-anchor="middle" font-size="11" fill="#7A8087">(spend + duplicate guards)</text>
  </g>

  <!-- Row 1: Model -->
  <g>
    <rect x="780" y="50" width="190" height="112" rx="10" fill="#FDECEA" stroke="#C77B6B" stroke-width="1.5"/>
    <text x="875" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1B1E27">Model</text>
    <text x="875" y="100" text-anchor="middle" font-size="12" fill="#4B5563">Anthropic, Groq,</text>
    <text x="875" y="118" text-anchor="middle" font-size="12" fill="#4B5563">or Bedrock</text>
    <text x="875" y="142" text-anchor="middle" font-size="11" fill="#7A8087">(swappable provider)</text>
  </g>

  <!-- Top row arrows -->
  <line x1="250" y1="106" x2="278" y2="106" stroke="#5C6470" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="264" y="98" text-anchor="middle" font-size="9" fill="#7A8087">POST /review/:id</text>

  <line x1="500" y1="106" x2="528" y2="106" stroke="#5C6470" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="514" y="98" text-anchor="middle" font-size="9" fill="#7A8087">runs agent</text>

  <line x1="750" y1="106" x2="778" y2="106" stroke="#5C6470" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="764" y="98" text-anchor="middle" font-size="9" fill="#7A8087">reasons via</text>

  <!-- Supabase box -->
  <g>
    <rect x="260" y="300" width="420" height="140" rx="10" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/>
    <text x="470" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#1B1E27">Supabase (Postgres)</text>
    <text x="470" y="354" text-anchor="middle" font-size="12" fill="#4B5563">clients · agent_decisions</text>
    <text x="470" y="374" text-anchor="middle" font-size="12" fill="#4B5563">agent_usage · support_requests</text>
    <text x="470" y="398" text-anchor="middle" font-size="11" fill="#7A8087">Row Level Security enabled on every table</text>
    <text x="470" y="416" text-anchor="middle" font-size="11" fill="#7A8087">(publishable key: read/limited write · secret key: full access)</text>
  </g>

  <!-- Dashboard -> Supabase (direct reads/writes) -->
  <path d="M140 162 L140 230 L360 230 L360 298" fill="none" stroke="#5C6470" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="222" text-anchor="middle" font-size="10" fill="#7A8087">reads / writes directly (RLS-secured)</text>

  <!-- Agent -> Supabase (tool calls) -->
  <path d="M640 162 L640 230 L580 230 L580 298" fill="none" stroke="#5C6470" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="660" y="222" text-anchor="middle" font-size="10" fill="#7A8087">get_client_context /</text>
  <text x="660" y="234" text-anchor="middle" font-size="10" fill="#7A8087">record_decision</text>

  <text x="500" y="470" text-anchor="middle" font-size="11" fill="#9CA3AF">Retention Action Agent — architecture overview</text>
</svg>